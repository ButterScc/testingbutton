<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ON OFF Control</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
    }

    .container {
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }

    button {
      width: 100%;
      height: 120px;
      border: none;
      border-radius: 20px;
      font-size: 2rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    .on {
      background: #16a34a;
    }

    .off {
      background: #dc2626;
    }

    @media (max-width: 480px) {
      button {
        height: 140px;
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="on" onclick="setStatus('ON')">ON</button>
    <button class="off" onclick="setStatus('OFF')">OFF</button>
  </div>

</body>
</html>
